features:
  - |
    The libvirt driver with the qcow2, raw, and rbd image backends now support
    LUKS encryption of ephemeral/local disks including root, ephemeral, and
    swap disks.

    .. note::

       In Ceph v17 (Quincy) creating a cloned image with an encryption key
       different from its parent is not supported. Support should be available
       in v18 and when we can require >= v18 we can support clone of encrypted
       images.

       See https://github.com/ceph/ceph/commit/1d3de19

    .. note::

       Live snapshot does not work with ephemeral encryption because the
       Libvirt blockRebase API does not seem to work with encrypted disks.

       https://libvirt.org/html/libvirt-libvirt-domain.html#virDomainBlockRebase


    The following server actions are currently supported:

    * create/delete
    * start/stop
    * reboot soft/hard
    * pause/unpause
    * suspend/resume
    * console create/show
    * interface attach/detach
    * volume attach/detach
    * diagnostics show
    * resize
    * cold migration
    * live migration
    * rebuild
    * evacuate
    * rescue
    * snapshot
    * shelve/unshelve
