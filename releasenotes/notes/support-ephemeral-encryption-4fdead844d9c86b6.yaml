features:
  - |
    The libvirt driver with the qcow2 and raw image backends now support LUKS
    encryption of ephemeral/local disks including root, ephemeral, and swap
    disks.

    .. note::

       Live snapshot does not work with ephemeral encryption because the
       Libvirt blockRebase API does not seem to work with encrypted disks.

       https://libvirt.org/html/libvirt-libvirt-domain.html#virDomainBlockRebase


    The following server actions are currently supported:

    * create/delete
    * start/stop
    * reboot soft/hard
    * pause/unpause
    * suspend/resume
    * console create/show
    * interface attach/detach
    * volume attach/detach
    * diagnostics show
    * resize
    * cold migration
    * live migration
    * rebuild
    * evacuate
    * rescue
    * snapshot
    * shelve/unshelve
